<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160">
  <title>A laptop connected to a switch, and that switch connected to a router.</title>
  <rect width="640" height="160" fill="#f7f4ef"/>
  <g fill="none" stroke="#1c1917" stroke-width="3">
    <rect x="24" y="36" width="160" height="88" rx="8" fill="#ffffff"/>
    <rect x="240" y="36" width="160" height="88" rx="8" fill="#ffffff"/>
    <rect x="456" y="36" width="160" height="88" rx="8" fill="#ffffff"/>
    <path d="M184 80 H240 M400 80 H456"/>
  </g>
  <g fill="#1c1917" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="104" y="88">Computer</text>
    <text x="320" y="88">Switch</text>
    <text x="536" y="88">Router</text>
  </g>
</svg>
