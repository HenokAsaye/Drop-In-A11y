<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Introduction to Computer Networking — Example Learning Site</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- The only integration step a host website needs: -->
    <script src="bridge-player.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to lesson</a>
    <header>
      <p class="site-name">Example Learning Site</p>
    </header>

    <main id="main">
      <h1>Introduction to Computer Networking</h1>
      <p>This page is an ordinary host website. The lesson player below is the embedded plugin.</p>

      <savanna-player
        lesson-id="networking-101"
        api-base="__SAVANNA_API_BASE__"
        sw-url="savanna-sw.js"
      ></savanna-player>

      <section id="careers" aria-labelledby="careers-heading">
        <h2 id="careers-heading">Career opportunities</h2>
        <div
          id="career-filters"
          class="career-filters"
          role="group"
          aria-label="Filter career opportunities"
          hidden
        >
          <div class="career-filter-field">
            <label for="career-filter-location">Location</label>
            <select id="career-filter-location" name="location">
              <option value="">All locations</option>
            </select>
          </div>
          <div class="career-filter-field">
            <label for="career-filter-accommodations">
              <input type="checkbox" id="career-filter-accommodations" name="accommodations" />
              Accommodations offered
            </label>
          </div>
        </div>
        <p id="careers-status" role="status" aria-live="polite">Loading career opportunities.</p>
        <p id="careers-error" role="alert" hidden></p>
        <div id="career-list" class="career-list"></div>
      </section>
      <script type="module">
        const section = document.getElementById('careers');
        const status = document.getElementById('careers-status');
        const error = document.getElementById('careers-error');
        const filtersContainer = document.getElementById('career-filters');
        const locationSelect = document.getElementById('career-filter-location');
        const accommodationsCheckbox = document.getElementById('career-filter-accommodations');
        const listContainer = document.getElementById('career-list');
        const failure = 'Career opportunities could not be loaded.';

        let allCareers = [];

        function stillThere() {
          return section !== null && section.isConnected;
        }

        function showStatus(message) {
          if (!stillThere() || status === null || error === null) return;
          error.hidden = true;
          error.textContent = '';
          status.textContent = message;
        }

        function showError() {
          if (!stillThere() || status === null || error === null) return;
          if (filtersContainer) filtersContainer.hidden = true;
          status.textContent = '';
          error.textContent = failure;
          error.hidden = false;
        }

        function populateLocations(jobs) {
          if (!locationSelect) return;
          const currentVal = locationSelect.value;
          const locations = Array.from(
            new Set(
              jobs
                .map((j) => (typeof j.location === 'string' ? j.location.trim() : ''))
                .filter(Boolean),
            ),
          ).sort();

          locationSelect.innerHTML = '<option value="">All locations</option>';
          for (const loc of locations) {
            const opt = document.createElement('option');
            opt.value = loc;
            opt.textContent = loc;
            locationSelect.appendChild(opt);
          }
          if (locations.includes(currentVal)) {
            locationSelect.value = currentVal;
          } else {
            locationSelect.value = '';
          }
        }

        function applyFilters() {
          if (!stillThere() || section === null) return;
          const selectedLocation = (locationSelect?.value ?? '').trim().toLowerCase();
          const accommodationsOnly = Boolean(accommodationsCheckbox?.checked);

          const matched = allCareers.filter((job) => {
            if (selectedLocation !== '') {
              const jobLoc = (
                typeof job.location === 'string' ? job.location.trim() : ''
              ).toLowerCase();
              if (jobLoc !== selectedLocation) return false;
            }
            if (accommodationsOnly) {
              const acc = typeof job.accommodations === 'string' ? job.accommodations.trim() : '';
              if (acc === '') return false;
            }
            return true;
          });

          renderJobs(matched);
        }

        function renderJobs(jobs) {
          if (!stillThere() || section === null) return;
          const target = listContainer || section;
          target.querySelectorAll('savanna-job-card').forEach((card) => {
            card.remove();
          });

          if (jobs.length === 0) {
            showStatus('No career opportunities match your filters.');
            return;
          }

          showStatus('');
          for (const job of jobs) {
            const card = document.createElement('savanna-job-card');
            card.job = job;
            target.append(card);
          }
        }

        locationSelect?.addEventListener('change', applyFilters);
        locationSelect?.addEventListener('input', applyFilters);
        accommodationsCheckbox?.addEventListener('change', applyFilters);

        function careersUrl(apiBase) {
          const base = new URL(apiBase);
          const prefix = base.href.endsWith('/') ? base.href : `${base.href}/`;
          return new URL('api/v1/careers', prefix).href;
        }

        function isNullableString(value) {
          return value === undefined || value === null || typeof value === 'string';
        }

        function isCareer(item) {
          if (typeof item !== 'object' || item === null || Array.isArray(item)) return false;
          return (
            typeof item.id === 'number' &&
            Number.isFinite(item.id) &&
            typeof item.title === 'string' &&
            typeof item.organization === 'string' &&
            typeof item.description === 'string' &&
            typeof item.applicationUrl === 'string' &&
            isNullableString(item.location) &&
            isNullableString(item.audioSummaryUrl) &&
            isNullableString(item.accommodations) &&
            isNullableString(item.certificateVerificationUrl)
          );
        }

        function isCareerPage(body) {
          if (typeof body !== 'object' || body === null || Array.isArray(body)) return false;
          if (!Array.isArray(body.items)) return false;
          if (![body.total, body.limit, body.offset].every((value) => Number.isFinite(value))) {
            return false;
          }
          return body.items.every(isCareer);
        }

        async function loadCareers() {
          if (!stillThere()) return;
          showStatus('Loading career opportunities.');

          const apiBase =
            document.querySelector('savanna-player')?.getAttribute('api-base')?.trim() ?? '';
          if (apiBase === '') {
            showError();
            return;
          }

          let url;
          try {
            url = careersUrl(apiBase);
          } catch {
            showError();
            return;
          }

          try {
            const response = await fetch(url, { headers: { accept: 'application/json' } });
            if (!stillThere()) return;
            if (!response.ok) {
              showError();
              return;
            }
            const body = await response.json();
            if (!stillThere()) return;
            if (!isCareerPage(body)) {
              showError();
              return;
            }
            if (!stillThere() || section === null) return;
            if (body.items.length === 0) {
              if (filtersContainer) filtersContainer.hidden = true;
              showStatus('No career opportunities are available.');
              return;
            }
            allCareers = body.items;
            if (filtersContainer) filtersContainer.hidden = false;
            populateLocations(allCareers);
            applyFilters();
          } catch {
            if (!stillThere()) return;
            showError();
          }
        }

        void loadCareers();
      </script>
    </main>

    <footer>
      <p>Demo host page for Savanna BridgePlayer.</p>
    </footer>
  </body>
</html>
