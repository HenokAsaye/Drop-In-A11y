name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web · lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: bridge-player-bundle
          path: |
            packages/player/dist
            packages/offline/dist
          retention-days: 7

  e2e:
    name: Web · e2e + axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @savanna/demo exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/demo/playwright-report
          retention-days: 7

  api:
    name: API · lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: savanna
          POSTGRES_PASSWORD: savanna
          POSTGRES_DB: savanna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U savanna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAVANNA_ENVIRONMENT: test
      SAVANNA_DATABASE_URL: postgresql+asyncpg://savanna:savanna@localhost:5432/savanna
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Unit tests
        run: uv run pytest --cov --cov-report=xml
      - name: Integration tests
        run: uv run pytest -m integration
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head

  contract:
    name: API ↔ plugin contract is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: apps/api
      - run: pnpm api:openapi
      - run: pnpm contracts:generate
      - name: Fail if generated contracts differ from the committed ones
        run: |
          if ! git diff --exit-code -- packages/contracts; then
            echo "::error::API schema changed. Run 'pnpm api:openapi && pnpm contracts:generate' and commit the result."
            exit 1
          fi

  docker:
    name: API · container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
